<title>Zohour Naturals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@200;300;400;500;600;800&family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens (Arsenijs Fabrica editorial system) ---------- */
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#eeeeee;
    --ink:#111111;
    --ink-soft:#818181;
    --ink-heading:#0d1717;
    --line:#eeeeee;
    --accent-ember:#f15730;
    --accent-tangerine:#f7651a;
    --accent-apricot:#ff8562;
    --accent-maroon:#111111;
    --accent-maroon-soft:#eeeeee;
    --accent-gold:#111111;
    --accent-gold-soft:#eeeeee;
    --accent-sage:#111111;
    --accent-sage-soft:#eeeeee;
    --accent-rose:#111111;
    --accent-rose-soft:#eeeeee;
    --primary:var(--accent-ember);
    --primary-hover:var(--accent-tangerine);
    --primary-ink:#ffffff;
    --color-success:#3F6C3B; --color-success-bg:#3F6C3B14; --color-success-border:#3F6C3B44;
    --color-error:#8C3B2F; --color-error-bg:#8C3B2F14; --color-error-border:#8C3B2F44;
    --shadow:none;
    --shadow-sm:none;
    --radius-lg:10px;
    --radius-md:8px;
    --radius-sm:8px;
    --radius-pill:999px;
    --radius-input:30px;
    --radius-image:15px;
    --font-display:'Onest',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-body:'Onest',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1717;
      --surface:#151f1f;
      --surface-2:#1c2727;
      --ink:#f2f2f2;
      --ink-soft:#9a9a9a;
      --ink-heading:#ffffff;
      --line:#263130;
      --accent-maroon:#f2f2f2; --accent-maroon-soft:#1c2727;
      --accent-gold:#f2f2f2; --accent-gold-soft:#1c2727;
      --accent-sage:#f2f2f2; --accent-sage-soft:#1c2727;
      --accent-rose:#f2f2f2; --accent-rose-soft:#1c2727;
      --primary:var(--accent-ember);
      --primary-ink:#ffffff;
      --shadow:none;
      --shadow-sm:none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1717; --surface:#151f1f; --surface-2:#1c2727; --ink:#f2f2f2; --ink-soft:#9a9a9a; --ink-heading:#ffffff;
    --line:#263130;
    --accent-maroon:#f2f2f2; --accent-maroon-soft:#1c2727;
    --accent-gold:#f2f2f2; --accent-gold-soft:#1c2727;
    --accent-sage:#f2f2f2; --accent-sage-soft:#1c2727;
    --accent-rose:#f2f2f2; --accent-rose-soft:#1c2727;
    --primary:var(--accent-ember); --primary-ink:#ffffff;
    --shadow:none;
    --shadow-sm:none;
    color-scheme: dark;
  }
  html[lang="ar"]{ --font-display:'Reem Kufi','Onest',sans-serif; --font-body:'Tajawal','Onest',sans-serif; }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-weight:400; line-height:1.55; font-size:16px; letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  html[lang="ar"] body{ letter-spacing:0; }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:500; letter-spacing:-0.01em; margin:0; text-wrap:balance; color:var(--ink-heading); }
  html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] h4{ letter-spacing:0; }
  p{ margin:0; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  img{ max-width:100%; display:block; }
  :focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  .container{ max-width:1280px; margin-inline:auto; padding-inline:24px; }
  @media (max-width:640px){ .container{ padding-inline:18px; } }

  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-heading); font-weight:600; }
  .eyebrow::before{ content:""; width:6px; height:6px; background:var(--accent-ember); border-radius:1px; flex:0 0 auto; }
  html[lang="ar"] .eyebrow{ text-transform:none; letter-spacing:0; }

  /* slim ember ornament divider between sections */
  .divider{ display:flex; align-items:center; justify-content:center; gap:16px; padding:8px 0 6px; }
  .divider::before, .divider::after{
    content:""; flex:1; max-width:240px; height:1px;
    background:linear-gradient(90deg, transparent, var(--accent-apricot), transparent);
  }
  .divider-mark{ width:7px; height:7px; background:var(--accent-ember); transform:rotate(45deg); border-radius:2px; opacity:.9; flex:0 0 auto; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:var(--radius-pill); padding:15px 26px; font-size:14px; font-weight:500;
    cursor:pointer; border:1px solid transparent; transition:background .15s ease, border-color .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--accent-ember); color:#ffffff; }
  .btn-primary:hover{ background:var(--accent-tangerine); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--ink); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-outline{ background:var(--surface); color:var(--ink); border-color:var(--accent-apricot); }
  .btn-outline:hover{ background:var(--surface-2); }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .btn-block{ width:100%; }
  .btn-sm{ padding:9px 16px; font-size:13px; }
  .icon-btn{
    width:42px; height:42px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--ink); cursor:pointer; position:relative; color:var(--ink);
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn svg{ width:20px; height:20px; }

  /* ---------- Header ---------- */
  .site-header{
    position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:14px; }
  .brand{ display:flex; align-items:center; text-decoration:none; }

  /* ---------- Wordmark (text-based logo, no image) ---------- */
  .wordmark{ display:flex; flex-direction:column; align-items:center; line-height:1; }
  .wordmark-leaf{ color:var(--accent-ember); }
  .wordmark-main{
    display:block; font-family:var(--font-display); font-weight:600; letter-spacing:-.01em;
    color:var(--ink-heading);
  }
  .wordmark-sub{ display:flex; align-items:center; text-transform:uppercase; color:var(--accent-ember); font-weight:600; }
  .wordmark-sub i{ display:block; height:1px; background:var(--accent-ember); font-style:normal; }
  html[lang="ar"] .wordmark-sub{ text-transform:none; }

  .wordmark-sm .wordmark-leaf{ width:16px; height:16px; margin-bottom:-1px; }
  .wordmark-sm .wordmark-main{ font-size:20px; }
  .wordmark-sm .wordmark-sub{ font-size:8.5px; letter-spacing:.22em; gap:6px; margin-top:1px; }
  .wordmark-sm .wordmark-sub i{ width:12px; }
  html[lang="ar"] .wordmark-sm .wordmark-sub{ letter-spacing:.05em; }

  .wordmark-lg .wordmark-leaf{ width:30px; height:30px; margin-bottom:-4px; }
  .wordmark-lg .wordmark-main{ font-size:clamp(32px,7vw,44px); }
  .wordmark-lg .wordmark-sub{ font-size:12px; letter-spacing:.32em; gap:12px; margin-top:4px; }
  .wordmark-lg .wordmark-sub i{ width:26px; }
  html[lang="ar"] .wordmark-lg .wordmark-sub{ letter-spacing:.08em; }
  nav.main-nav{ display:flex; align-items:center; gap:30px; }
  nav.main-nav a{ text-decoration:none; font-size:14.5px; font-weight:600; color:var(--ink-soft); padding-block:4px; border-bottom:2px solid transparent; }
  nav.main-nav a:hover{ color:var(--ink-heading); border-color:var(--ink); }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  @media (max-width:380px){
    .header-actions{ gap:6px; }
    .icon-btn{ width:36px; height:36px; }
    .wordmark-sm .wordmark-main{ font-size:17px; }
  }
  .lang-switch{ display:flex; gap:2px; padding:3px; border-radius:999px; border:1px solid var(--line); background:var(--surface); }
  .lang-switch button{
    font-size:11.5px; font-weight:700; letter-spacing:.03em; padding:7px 10px; border-radius:999px; border:none;
    background:transparent; cursor:pointer; color:var(--ink-soft);
  }
  .lang-switch button[aria-pressed="true"]{ background:var(--primary); color:var(--primary-ink); }
  @media (max-width:420px){ .lang-switch button{ padding:7px 8px; } }
  .cart-count{
    position:absolute; inset-inline-end:-2px; top:-2px; background:var(--accent-tangerine); color:#ffffff;
    font-size:9px; font-weight:700; min-width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .hamburger{ display:none; }
  @media (max-width:900px){
    nav.main-nav{ display:none; }
    .hamburger{ display:inline-flex; }
  }
  .mobile-nav{
    display:none; flex-direction:column; gap:2px; padding:10px 24px 18px; border-top:1px solid var(--line);
  }
  .mobile-nav.open{ display:flex; }
  .mobile-nav a{ text-decoration:none; color:var(--ink); font-weight:600; padding:12px 4px; border-bottom:1px solid var(--line); font-size:15px; }

  /* ---------- Hero ---------- */
  .hero{ position:relative; padding-block:64px 56px; overflow:hidden; text-align:center; }
  .hero-inner{ position:relative; z-index:2; max-width:640px; margin-inline:auto; display:flex; flex-direction:column; align-items:center; }
  .hero h1{ font-size:clamp(34px,5.6vw,64px); font-weight:200; letter-spacing:-0.035em; line-height:1.03; margin-block:14px 16px; }
  html[lang="ar"] .hero h1{ font-weight:600; letter-spacing:0; }
  .hero-lead{ font-size:17px; color:var(--ink-soft); max-width:46ch; margin:0 auto 28px; }
  .hero-actions{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .hero-stats{ display:flex; gap:30px; margin-top:38px; flex-wrap:wrap; justify-content:center; }
  .hero-stat b{ display:block; font-family:var(--font-display); font-weight:200; font-size:38px; letter-spacing:-0.03em; color:var(--ink-heading); }
  html[lang="ar"] .hero-stat b{ font-weight:600; letter-spacing:0; }
  .hero-stat span{ font-size:12px; color:var(--ink-soft); letter-spacing:.04em; }
  .hero-strip{ display:flex; gap:14px; justify-content:center; margin-top:44px; flex-wrap:wrap; position:relative; z-index:2; }
  .hero-chip{
    width:74px; height:74px; border-radius:50%; overflow:hidden; position:relative; flex:0 0 auto;
    border:3px solid var(--surface); box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center;
  }
  .hero-chip svg{ width:42%; height:42%; }
  @media (max-width:560px){ .hero-chip{ width:58px; height:58px; } }

  /* ---------- Steam / mist ---------- */
  .steam-veil{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(ellipse 70% 60% at 50% 38%, var(--surface) 0%, var(--bg) 55%, transparent 100%);
    animation:steamClear 2.4s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes steamClear{
    0%{ opacity:1; }
    55%{ opacity:.85; }
    100%{ opacity:0; }
  }
  .wisp{
    position:absolute; bottom:-60px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 72%);
    filter:blur(16px); opacity:0; z-index:1; pointer-events:none;
    animation:wispDrift 9s ease-in-out infinite;
  }
  .wisp.w1{ width:160px; height:200px; left:18%; animation-delay:.3s; }
  .wisp.w2{ width:130px; height:180px; left:47%; animation-delay:2.6s; }
  .wisp.w3{ width:180px; height:220px; left:72%; animation-delay:5s; }
  @keyframes wispDrift{
    0%{ transform:translateY(0) translateX(0) scale(1); opacity:0; }
    18%{ opacity:.5; }
    55%{ transform:translateY(-160px) translateX(12px) scale(1.2); opacity:.28; }
    100%{ transform:translateY(-300px) translateX(-10px) scale(1.35); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .steam-veil{ display:none; } .wisp{ display:none; } }

  /* ---------- Category chips ---------- */
  .cat-nav{ display:flex; gap:10px; overflow-x:auto; padding:22px 0 6px; scrollbar-width:none; }
  .cat-nav::-webkit-scrollbar{ display:none; }
  .cat-chip{
    flex:0 0 auto; padding:10px 20px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
    font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .cat-chip[aria-pressed="true"]{ background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }

  /* ---------- Section shell ---------- */
  section{ padding-block:56px; }
  .section-head{ max-width:640px; margin-bottom:38px; }
  .section-head h2{ font-size:clamp(26px,3.4vw,40px); font-weight:300; letter-spacing:-0.025em; margin-top:8px; }
  html[lang="ar"] .section-head h2{ font-weight:600; letter-spacing:0; }
  .section-head p{ color:var(--ink-soft); margin-top:12px; font-size:15.5px; }

  /* ---------- Catalog ---------- */
  .cat-group{ margin-bottom:30px; border-bottom:1px solid var(--line); padding-bottom:30px; }
  .cat-group:last-child{ border-bottom:none; }
  .cat-group-title{
    all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    width:100%; gap:12px; margin-bottom:18px; padding-block:2px;
  }
  .cat-group-title h3{ font-size:21px; }
  .cat-group-meta{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); flex:0 0 auto; }
  .cat-group-chevron{ width:16px; height:16px; color:var(--ink-soft); transition:transform .2s ease; flex:0 0 auto; }
  .cat-group.collapsed .cat-group-chevron{ transform:rotate(-90deg); }
  html[dir="rtl"] .cat-group.collapsed .cat-group-chevron{ transform:rotate(90deg); }
  .cat-group.collapsed .product-grid{ display:none; }
  .product-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
  .card{
    background:var(--surface); border:1.5px solid var(--accent-apricot); border-radius:var(--radius-lg); overflow:hidden;
    display:flex; flex-direction:column; transition:transform .18s ease;
  }
  .card:hover{ transform:translateY(-3px); }
  .swatch{
    aspect-ratio:4/3; position:relative; display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(45deg, var(--line) 25%, transparent 25.5%),
      linear-gradient(-45deg, var(--line) 25%, transparent 25.5%),
      linear-gradient(135deg, var(--accent-soft) 0%, var(--surface-2) 100%);
    background-size:16px 16px, 16px 16px, 100% 100%;
    background-position:0 0, 0 0, 0 0;
  }
  .swatch svg{ width:34%; height:34%; color:var(--accent); position:relative; }
  .swatch img, .modal-hero img, .hero-chip img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .badge{
    position:absolute; top:12px; inset-inline-start:12px; z-index:2; font-size:11px; font-weight:700; letter-spacing:.03em;
    padding:5px 11px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--ink-soft);
  }
  .badge.in{ color:#3F6C3B; border-color:#3F6C3B44; background:#3F6C3B14; }
  .badge.out{ color:#8C3B2F; border-color:#8C3B2F44; background:#8C3B2F14; }
  .brand-tag{ position:absolute; top:12px; inset-inline-end:12px; z-index:2; font-size:10.5px; font-weight:700; background:var(--ink); color:var(--bg); padding:4px 9px; border-radius:6px; opacity:.85; }
  .discount-badge{
    position:absolute; bottom:12px; inset-inline-start:12px; z-index:2; font-size:11px; font-weight:700;
    background:var(--accent-tangerine); color:#ffffff; padding:5px 10px; border-radius:999px; display:flex; align-items:center; gap:4px;
  }
  .discount-badge svg{ width:12px; height:12px; }
  .price-old{ font-size:12px; color:var(--ink-soft); text-decoration:line-through; font-weight:500; margin-inline-end:6px; }
  .swatch-dots{ display:flex; gap:8px; position:relative; }
  .swatch-dot{ width:20px; height:20px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line); }
  .card-body{ padding:18px 18px 20px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card-body h4{ font-size:16.5px; line-height:1.3; }
  .card-tagline{ font-size:13px; color:var(--ink-soft); }
  .card-footer{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:12px; }
  .price{ font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--ink-heading); }
  .price small{ display:block; font-family:var(--font-body); font-weight:500; font-size:10.5px; color:var(--ink-soft); }
  .card-cta{ display:flex; gap:8px; }

  /* ---------- Gift set builder ---------- */
  .giftset-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:20px; }
  .giftset-item{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:12px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .giftset-item.active{ border-color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset; }
  .giftset-thumb{
    width:50px; height:50px; border-radius:12px; overflow:hidden; position:relative; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .giftset-thumb svg{ width:50%; height:50%; color:var(--accent); position:relative; }
  .giftset-info{ flex:1; min-width:0; }
  .giftset-info h5{ font-size:13.5px; font-weight:600; margin-bottom:2px; line-height:1.25; }
  .giftset-info span{ font-size:11.5px; color:var(--ink-soft); }
  .giftset-qty{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .giftset-bar{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:18px 24px; box-shadow:var(--shadow-sm);
  }
  .giftset-summary{ font-size:15px; font-weight:600; color:var(--ink-soft); }
  .giftset-summary b{ font-family:var(--font-display); color:var(--ink-heading); font-size:17px; }

  /* ---------- Empty state (discounts / reviews) ---------- */
  .empty-state-block{
    text-align:center; padding:44px 24px; background:var(--surface); border:1px dashed var(--line);
    border-radius:var(--radius-lg); color:var(--ink-soft);
  }
  .empty-state-block svg{ width:32px; height:32px; color:var(--accent-gold); margin-bottom:14px; }
  .empty-state-block p{ font-size:14.5px; max-width:42ch; margin:0 auto 18px; }

  /* ---------- Reviews ---------- */
  .reviews-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
  .review-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; }
  .review-stars{ display:flex; gap:2px; margin-bottom:12px; color:var(--accent-gold); }
  .review-stars svg{ width:15px; height:15px; }
  .review-text{ font-size:14.5px; color:var(--ink); margin-bottom:16px; line-height:1.6; }
  .review-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .review-name{ font-family:var(--font-display); font-size:14.5px; font-weight:600; }
  .review-tag{ font-size:11.5px; color:var(--ink-soft); }

  /* ---------- Tips ---------- */
  .tips-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
  .tip-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px; }
  .tip-icon{ width:46px; height:46px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .tip-icon svg{ width:24px; height:24px; }
  .tip-card h3{ font-size:18px; margin-bottom:8px; }
  .tip-card p{ font-size:14px; color:var(--ink-soft); margin-bottom:14px; }
  .tip-links{ display:flex; flex-wrap:wrap; gap:8px; }
  .tip-link{ font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; color:var(--ink); text-decoration:none; }
  .tip-link:hover{ border-color:var(--accent-ember); color:var(--accent-ember); }
  .tips-note{ margin-top:30px; padding:16px 20px; border-radius:var(--radius-md); background:var(--surface-2); border:1px solid var(--accent-apricot); font-size:13.5px; color:var(--ink-soft); display:flex; gap:10px; }
  .tips-note svg{ width:20px; height:20px; flex:0 0 auto; color:var(--accent-ember); margin-top:1px; }

  /* ---------- About / contact ---------- */
  .about-grid{ display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center; }
  @media (max-width:800px){ .about-grid{ grid-template-columns:1fr; } }
  .about-grid p{ color:var(--ink-soft); margin-bottom:14px; font-size:15.5px; }
  .about-figure{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:26px; box-shadow:var(--shadow-sm); }
  .about-list{ display:flex; flex-direction:column; gap:14px; margin-top:18px; }
  .about-item{ display:flex; gap:12px; align-items:flex-start; }
  .about-item svg{ width:22px; height:22px; color:var(--ink); flex:0 0 auto; margin-top:2px; }
  .about-item b{ display:block; font-size:14.5px; }
  .about-item span{ font-size:13px; color:var(--ink-soft); }

  .contact-section{ background:var(--surface-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .contact-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; }
  .contact-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:20px; display:flex; gap:14px; align-items:flex-start; }
  .contact-card svg{ width:24px; height:24px; color:var(--ink); flex:0 0 auto; }
  .contact-card b{ display:block; font-size:14.5px; margin-bottom:3px; }
  .contact-card span, .contact-card a{ font-size:13.5px; color:var(--ink-soft); text-decoration:none; }

  footer.site-footer{ padding:34px 0; text-align:center; }
  footer.site-footer p{ font-size:12.5px; color:var(--ink-soft); }
  footer.site-footer p + p{ margin-top:4px; }

  /* ---------- Drawer / Modal shared ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,12,8,.5); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:60;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .drawer{
    --hidden-x:100%;
    position:fixed; top:0; inset-inline-end:0; height:100%; width:min(420px,92vw); background:var(--bg);
    border-inline-start:1px solid var(--ink); z-index:70; transform:translateX(var(--hidden-x)); transition:transform .25s ease;
    display:flex; flex-direction:column;
  }
  html[dir="rtl"] .drawer{ --hidden-x:-100%; }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--line); }
  .drawer-head h3{ font-size:19px; }
  .drawer-body{ flex:1; overflow-y:auto; padding:18px 22px; }
  .drawer-foot{ padding:18px 22px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }

  .cart-item{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .cart-item-swatch{ width:56px; height:56px; border-radius:var(--radius-sm); flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent); }
  .cart-item-swatch svg{ width:26px; height:26px; }
  .cart-item-info{ flex:1; min-width:0; }
  .cart-item-info h5{ font-size:14px; font-weight:600; margin-bottom:2px; }
  .cart-item-info p{ font-size:12px; color:var(--ink-soft); }
  .qty-row{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .qty-btn{ width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .qty-val{ font-size:13px; font-weight:600; min-width:16px; text-align:center; font-variant-numeric:tabular-nums; }
  .remove-link{ font-size:11.5px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; margin-inline-start:auto; }
  .empty-state{ text-align:center; padding:50px 10px; color:var(--ink-soft); font-size:14px; }
  .empty-state svg{ width:44px; height:44px; margin-bottom:14px; color:var(--line); }

  .modal-wrap{
    position:fixed; inset:0; z-index:80; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(20,12,8,.5);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .modal-wrap.open{ opacity:1; pointer-events:auto; }
  @media (min-width:720px){ .modal-wrap{ align-items:center; } }
  .modal-card{
    position:relative; background:var(--bg); width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
    border-radius:16px 16px 0 0; transform:translateY(24px); transition:transform .22s ease;
    border:1px solid var(--ink);
  }
  @media (min-width:720px){ .modal-card{ border-radius:var(--radius-lg); margin:20px; } }
  .modal-wrap.open .modal-card{ transform:translateY(0); }
  .modal-close{ position:absolute; top:16px; inset-inline-end:16px; z-index:2; background:var(--surface); }
  .modal-hero{ aspect-ratio:16/8; display:flex; align-items:center; justify-content:center; position:relative;
    background:var(--surface-2); }
  .modal-hero svg{ width:70px; height:70px; color:var(--accent); }
  .modal-content{ padding:26px 26px 30px; }
  .modal-content .eyebrow{ margin-bottom:8px; }
  .modal-content h3{ font-size:24px; margin-bottom:10px; }
  .modal-content .card-tagline{ margin-bottom:16px; }
  .modal-desc{ font-size:14.5px; color:var(--ink-soft); margin-bottom:18px; }
  .modal-block{ margin-bottom:18px; }
  .modal-block h5{ font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:8px; }
  html[lang="ar"] .modal-block h5{ text-transform:none; letter-spacing:0; }
  .skin-tags{ display:flex; flex-wrap:wrap; gap:7px; }
  .skin-tag{ font-size:12px; font-weight:600; padding:5px 12px; border-radius:999px; background:var(--accent-sage-soft); color:var(--accent-sage); }
  .modal-buy-row{ display:flex; align-items:center; gap:14px; margin-top:22px; padding-top:20px; border-top:1px solid var(--line); flex-wrap:wrap; }

  .order-summary-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .order-summary-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); }
  .order-summary-row span:last-child{ color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .order-summary-total{ background:var(--surface-2); border-color:var(--accent-apricot); font-weight:700; }
  .order-summary-total span{ color:var(--ink) !important; }
  .order-summary-total span:last-child{ color:var(--ink-heading) !important; font-family:var(--font-display); }
  .form-field{ margin-bottom:16px; }
  .form-row-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .form-row-3 .form-field{ margin-bottom:16px; }
  @media (max-width:420px){ .form-row-3{ grid-template-columns:1fr; gap:0; } }
  .form-field label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .form-field input, .form-field textarea{
    width:100%; padding:12px 18px; border-radius:var(--radius-input); border:1px solid var(--ink); background:var(--surface);
    font-family:inherit; font-size:14.5px; color:var(--ink); resize:vertical;
  }
  .form-field textarea{ border-radius:var(--radius-lg); }
  .form-field input:focus, .form-field textarea:focus{ border-color:var(--primary); }
  .form-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; }
  .order-actions{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .order-message-box textarea{ width:100%; min-height:120px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); padding:12px 14px; font-size:13px; color:var(--ink-soft); font-family:inherit; }
  .send-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .send-row .btn{ flex:1; }
  .copy-note{ font-size:12px; color:var(--ink-soft); margin-top:8px; min-height:16px; }

  /* ---------- Large screens / TV ---------- */
  @media (min-width:1440px){
    .container{ max-width:1440px; }
    .hero{ padding-block:88px 76px; }
    .hero h1{ font-size:76px; }
    .hero-lead{ font-size:19px; max-width:52ch; }
    .section-head h2{ font-size:46px; }
    .section-head p{ font-size:17px; }
    .product-grid{ grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:26px; }
    .card-body h4{ font-size:18px; }
    .hero-chip{ width:88px; height:88px; }
    .hero-stat b{ font-size:46px; }
  }
  @media (min-width:1920px){
    .container{ max-width:1600px; }
    .hero h1{ font-size:92px; }
    .section-head h2{ font-size:54px; }
  }

  [hidden]{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
  }
</style>

  /* =====================================================
     STATE
     ===================================================== */
  var state = {
    lang: "en",
    activeCategory: "all",
    cart: {}, // id -> qty
    giftSet: {}, // id -> qty, picked in the "build your own gift set" section
    openGroups: {} // category id -> bool, catalog accordion state
  };

  try{
    var savedLang = localStorage.getItem("zn_lang");
    if(savedLang === "en" || savedLang === "ar" || savedLang === "ru") state.lang = savedLang;
    var savedCart = JSON.parse(localStorage.getItem("zn_cart") || "{}");
    if(savedCart && typeof savedCart === "object") state.cart = savedCart;
  }catch(e){}

  function t(key){ return (STRINGS[state.lang] && STRINGS[state.lang][key]) || (STRINGS.en[key] || ""); }
  function tt(field){ return field ? (field[state.lang] || field.en || "") : ""; }
  function productById(id){ for(var i=0;i<PRODUCTS.length;i++){ if(PRODUCTS[i].id===id) return PRODUCTS[i]; } return null; }
  function catById(id){ for(var i=0;i<CATEGORIES.length;i++){ if(CATEGORIES[i].id===id) return CATEGORIES[i]; } return null; }
  function saveCart(){ try{ localStorage.setItem("zn_cart", JSON.stringify(state.cart)); }catch(e){} }

  function itemsLabel(count){
    if(state.lang === "ru"){
      var mod10 = count % 10, mod100 = count % 100;
      var word = "товаров";
      if(mod10===1 && mod100!==11) word = "товар";
      else if(mod10>=2 && mod10<=4 && (mod100<12 || mod100>14)) word = "товара";
      return count + " " + word;
    }
    if(state.lang === "ar") return count + " منتج";
    return count + " item" + (count===1?"":"s");
  }

  function discountedPrice(p){
    if(p.price <= 0) return 0;
    if(!p.discount) return p.price;
    return Math.max(0, Math.round(p.price * (1 - p.discount/100)));
  }
  function priceHtml(p){
    if(p.price > 0){
      if(p.discount > 0){
        return '<span class="price"><span class="price-old">'+p.price+' '+CURRENCY+'</span>'+discountedPrice(p)+' '+CURRENCY+'</span>';
      }
      return '<span class="price">'+p.price+' '+CURRENCY+'</span>';
    }
    return '<span class="price">—<small>'+t("priceNote")+'</small></span>';
  }
  function priceText(p){
    if(p.price <= 0) return t("priceNote");
    return discountedPrice(p) + " " + CURRENCY;
  }
  function discountBadgeHtml(p){
    return p.discount > 0 ? '<span class="discount-badge"><svg><use href="#i-tag"/></svg>-'+p.discount+'%</span>' : "";
  }
  // true once every item in the cart has a real price — until then we
  // never show a grand total, only the parts we actually know (delivery).
  function cartFullyPriced(){
    return Object.keys(state.cart).every(function(id){
      var p = productById(id);
      return p && p.price > 0;
    });
  }
  function cartSubtotal(){
    var total = 0;
    Object.keys(state.cart).forEach(function(id){
      var p = productById(id);
      if(p && p.price > 0) total += discountedPrice(p) * state.cart[id];
    });
    return total;
  }

  /* =====================================================
     RENDER: static text (data-i18n) + document direction
     ===================================================== */
  function applyLanguage(){
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var key = el.getAttribute("data-i18n");
      el.textContent = t(key);
    });
    document.querySelectorAll("#langSwitch button").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === state.lang ? "true" : "false");
    });
    document.getElementById("orderIntro").textContent = t("orderIntro");
    try{ localStorage.setItem("zn_lang", state.lang); }catch(e){}
  }

  /* =====================================================
     RENDER: hero mini swatches
     ===================================================== */
  function renderHeroSwatches(){
    var feature = ["black-soap","kessa-glove","ghassoul-clay","hammam-box"];
    var html = "";
    feature.forEach(function(id){
      var p = productById(id);
      if(!p) return;
      var inner = photoSlotHtml(p) || '<svg><use href="#'+p.icon+'"/></svg>';
      html += '<div class="hero-chip" title="'+tt(p.name)+'" style="--accent:var(--accent-'+p.accent+');--accent-soft:var(--accent-'+p.accent+'-soft);background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));">'+
        inner+'</div>';
    });
    var wrap = document.getElementById("heroSwatches");
    wrap.innerHTML = html;
    hydratePhotos(wrap);
    hydrateIcons(wrap);
  }

  /* =====================================================
     RENDER: category chips
     ===================================================== */
  function renderCatNav(){
    var html = '<button class="cat-chip" data-cat="all" aria-pressed="'+(state.activeCategory==="all")+'">'+t("catAll")+'</button>';
    CATEGORIES.forEach(function(c){
      html += '<button class="cat-chip" data-cat="'+c.id+'" aria-pressed="'+(state.activeCategory===c.id)+'">'+tt(c.name)+'</button>';
    });
    var nav = document.getElementById("catNav");
    nav.innerHTML = html;
    nav.querySelectorAll(".cat-chip").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.activeCategory = btn.getAttribute("data-cat");
        if(state.activeCategory !== "all") state.openGroups[state.activeCategory] = true;
        renderCatNav();
        renderCatalog();
      });
    });
  }

  /* =====================================================
     RENDER: catalog groups + product cards
     ===================================================== */
  function productCardHtml(p){
    var swatchInner = photoSlotHtml(p) || (p.multi
      ? '<div class="swatch-dots">' + SOAP_DOTS.map(function(c){ return '<span class="swatch-dot" style="background:'+c+'"></span>'; }).join("") + '</div>'
      : '<svg><use href="#'+p.icon+'"/></svg>');
    var badge = p.inStock
      ? '<span class="badge in">'+t("inStock")+'</span>'
      : '<span class="badge out">'+t("outOfStock")+'</span>';
    var brandTag = p.brand ? '<span class="brand-tag">'+t("brandBy")+' '+p.brand+'</span>' : "";
    return (
      '<article class="card" data-id="'+p.id+'" style="--accent:var(--accent-'+p.accent+');--accent-soft:var(--accent-'+p.accent+'-soft);">'+
        '<div class="swatch" data-open="'+p.id+'">'+badge+brandTag+discountBadgeHtml(p)+swatchInner+'</div>'+
        '<div class="card-body">'+
          '<h4 data-open="'+p.id+'" style="cursor:pointer">'+tt(p.name)+'</h4>'+
          '<p class="card-tagline">'+tt(p.tagline)+'</p>'+
          '<div class="card-footer">'+
            priceHtml(p)+
            '<div class="card-cta">'+
              '<button class="btn btn-outline btn-sm" data-open="'+p.id+'">'+t("viewDetails")+'</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</article>'
    );
  }

  function initOpenGroups(){
    var mobile = window.innerWidth <= 640;
    CATEGORIES.forEach(function(c, idx){
      state.openGroups[c.id] = mobile ? idx===0 : true;
    });
  }

  function renderCatalog(){
    var groups = CATEGORIES.filter(function(c){ return state.activeCategory==="all" || state.activeCategory===c.id; });
    var multiGroup = state.activeCategory === "all";
    var html = "";
    groups.forEach(function(c){
      var items = PRODUCTS.filter(function(p){ return p.category===c.id; });
      if(!items.length) return;
      var isOpen = multiGroup ? !!state.openGroups[c.id] : true;
      html += '<div class="cat-group'+(isOpen?"":" collapsed")+'">'+
        '<button class="cat-group-title" data-toggle="'+c.id+'" aria-expanded="'+isOpen+'">'+
          '<h3>'+tt(c.name)+'</h3>'+
          '<span class="cat-group-meta">'+itemsLabel(items.length)+'<svg class="cat-group-chevron"><use href="#i-chevron"/></svg></span>'+
        '</button>'+
        '<div class="product-grid">'+ items.map(productCardHtml).join("") +'</div></div>';
    });
    var wrap = document.getElementById("catalogGroups");
    wrap.innerHTML = html;
    wrap.querySelectorAll("[data-open]").forEach(function(el){
      el.addEventListener("click", function(){ openProductModal(el.getAttribute("data-open")); });
    });
    wrap.querySelectorAll("[data-toggle]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-toggle");
        state.openGroups[id] = !state.openGroups[id];
        renderCatalog();
      });
    });
    hydratePhotos(wrap);
    hydrateIcons(wrap);
  }

  /* =====================================================
     RENDER: discounts
     ===================================================== */
  function renderDiscounts(){
    var body = document.getElementById("discountsBody");
    var items = PRODUCTS.filter(function(p){ return p.discount > 0; });
    if(!items.length){
      body.innerHTML = '<div class="empty-state-block"><svg><use href="#i-tag"/></svg><p>'+t("discountsEmpty")+'</p></div>';
      hydrateIcons(body);
      return;
    }
    body.innerHTML = '<div class="product-grid">' + items.map(productCardHtml).join("") + '</div>';
    body.querySelectorAll("[data-open]").forEach(function(el){
      el.addEventListener("click", function(){ openProductModal(el.getAttribute("data-open")); });
    });
    hydratePhotos(body);
    hydrateIcons(body);
  }

  /* =====================================================
     GIFT SET BUILDER — pick any products, qty per product,
     live total, then dump the whole selection into the cart.
     ===================================================== */
  function giftSetItems(){
    return PRODUCTS.filter(function(p){ return p.category !== "gifts"; });
  }
  function renderGiftSet(){
    var html = giftSetItems().map(function(p){
      var qty = state.giftSet[p.id] || 0;
      var thumbInner = photoSlotHtml(p) || '<svg><use href="#'+p.icon+'"/></svg>';
      return '<div class="giftset-item'+(qty>0?" active":"")+'" style="--accent:var(--accent-'+p.accent+');--accent-soft:var(--accent-'+p.accent+'-soft);">'+
        '<div class="giftset-thumb" style="background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));">'+thumbInner+'</div>'+
        '<div class="giftset-info"><h5>'+tt(p.name)+'</h5><span>'+priceText(p)+'</span></div>'+
        '<div class="giftset-qty">'+
          '<button class="qty-btn" data-gs="dec" data-id="'+p.id+'">−</button>'+
          '<span class="qty-val">'+qty+'</span>'+
          '<button class="qty-btn" data-gs="inc" data-id="'+p.id+'">+</button>'+
        '</div>'+
      '</div>';
    }).join("");
    var grid = document.getElementById("giftsetGrid");
    grid.innerHTML = html;
    hydratePhotos(grid);
    hydrateIcons(grid);
    grid.querySelectorAll("[data-gs]").forEach(function(btn){
      var id = btn.getAttribute("data-id");
      var act = btn.getAttribute("data-gs");
      btn.addEventListener("click", function(){
        var cur = state.giftSet[id] || 0;
        cur = act === "inc" ? cur + 1 : Math.max(0, cur - 1);
        if(cur <= 0) delete state.giftSet[id]; else state.giftSet[id] = cur;
        renderGiftSet();
      });
    });
    updateGiftSetSummary();
  }
  function updateGiftSetSummary(){
    var ids = Object.keys(state.giftSet);
    var count = 0, total = 0;
    ids.forEach(function(id){
      var p = productById(id); var qty = state.giftSet[id];
      count += qty;
      if(p && p.price > 0) total += discountedPrice(p) * qty;
    });
    var totalText = total > 0 ? (total + " " + CURRENCY) : "—";
    document.getElementById("giftsetSummary").innerHTML = itemsLabel(count) + " · <b>" + totalText + "</b>";
    document.getElementById("giftsetAddBtn").disabled = count === 0;
  }
  function addGiftSetToCart(){
    Object.keys(state.giftSet).forEach(function(id){
      state.cart[id] = (state.cart[id] || 0) + state.giftSet[id];
    });
    state.giftSet = {};
    saveCart();
    renderCart();
    renderGiftSet();
    openCart();
  }

  /* =====================================================
     RENDER: tips
     ===================================================== */
  function renderTips(){
    var html = SKIN_TIPS.map(function(tip){
      var links = tip.productIds.map(function(id){
        var p = productById(id);
        if(!p) return "";
        return '<button class="tip-link" data-open="'+id+'">'+tt(p.name)+'</button>';
      }).join("");
      return '<div class="tip-card" style="--accent:var(--accent-'+tip.accent+');--accent-soft:var(--accent-'+tip.accent+'-soft);">'+
        '<div class="tip-icon"><svg><use href="#'+tip.icon+'"/></svg></div>'+
        '<h3>'+tt(tip.name)+'</h3>'+
        '<p>'+tt(tip.text)+'</p>'+
        '<div class="tip-links">'+links+'</div>'+
      '</div>';
    }).join("");
    var grid = document.getElementById("tipsGrid");
    grid.innerHTML = html;
    grid.querySelectorAll("[data-open]").forEach(function(el){
      el.addEventListener("click", function(){ openProductModal(el.getAttribute("data-open")); });
    });
    hydrateIcons(grid);
  }

  /* =====================================================
     RENDER: reviews
     ===================================================== */
  function renderReviews(){
    var body = document.getElementById("reviewsBody");
    if(!REVIEWS.length){
      body.innerHTML =
        '<div class="empty-state-block">'+
          '<svg><use href="#i-star"/></svg>'+
          '<p>'+t("reviewsEmpty")+'</p>'+
          '<a class="btn btn-outline btn-sm" href="https://wa.me/'+SHOP_WHATSAPP+'" target="_blank" rel="noopener">'+t("reviewsCta")+'</a>'+
        '</div>';
      hydrateIcons(body);
      return;
    }
    var html = REVIEWS.map(function(r){
      var stars = "";
      for(var i=0;i<5;i++){ stars += '<svg'+(i<r.rating?"":' style="opacity:.25"')+'><use href="#i-star"/></svg>'; }
      var tagHtml = "";
      if(r.productId){
        var p = productById(r.productId);
        if(p) tagHtml = '<span class="review-tag">'+tt(p.name)+'</span>';
      }
      return '<div class="review-card"><div class="review-stars">'+stars+'</div>'+
        '<p class="review-text">"'+r.text+'"</p>'+
        '<div class="review-foot"><span class="review-name">'+r.name+'</span>'+tagHtml+'</div></div>';
    }).join("");
    body.innerHTML = '<div class="reviews-grid">'+html+'</div>';
    hydrateIcons(body);
  }

  /* =====================================================
     PRODUCT MODAL
     ===================================================== */
  function openProductModal(id){
    var p = productById(id);
    if(!p) return;
    var skinHtml = p.skin.length ? (
      '<div class="modal-block"><h5>'+t("modalSkin")+'</h5><div class="skin-tags">'+
      p.skin.map(function(sid){ var s=null; SKIN_TIPS.forEach(function(x){ if(x.id===sid) s=x; }); return s?'<span class="skin-tag">'+tt(s.name)+'</span>':""; }).join("")+
      '</div></div>'
    ) : "";
    var brandLine = p.brand ? '<p class="card-tagline">'+t("brandBy")+' '+p.brand+'</p>' : "";
    var swatchInner = photoSlotHtml(p) || (p.multi
      ? '<div class="swatch-dots">' + SOAP_DOTS.map(function(c){ return '<span class="swatch-dot" style="width:30px;height:30px;background:'+c+'"></span>'; }).join("") + '</div>'
      : '<svg><use href="#'+p.icon+'"/></svg>');
    var badge = p.inStock ? '<span class="badge in">'+t("inStock")+'</span>' : '<span class="badge out">'+t("outOfStock")+'</span>';

    document.getElementById("productModalCard").innerHTML =
      '<button class="icon-btn modal-close" id="productModalCloseBtn" type="button"><svg><use href="#i-close"/></svg></button>'+
      '<div class="modal-hero" style="--accent:var(--accent-'+p.accent+');--accent-soft:var(--accent-'+p.accent+'-soft);">'+badge+discountBadgeHtml(p)+swatchInner+'</div>'+
      '<div class="modal-content">'+
        '<span class="eyebrow">'+tt(catById(p.category).name)+'</span>'+
        '<h3>'+tt(p.name)+'</h3>'+
        brandLine+
        '<p class="card-tagline">'+tt(p.tagline)+'</p>'+
        '<p class="modal-desc">'+tt(p.desc)+'</p>'+
        '<div class="modal-block"><h5>'+t("modalHowTo")+'</h5><p class="modal-desc" style="margin:0">'+tt(p.howTo)+'</p></div>'+
        skinHtml+
        '<div class="modal-buy-row">'+
          priceHtml(p)+
          '<button class="btn btn-primary" id="modalAddBtn" '+(p.inStock?"":"disabled")+'>'+t("addToCart")+'</button>'+
        '</div>'+
      '</div>';

    document.getElementById("productModalCloseBtn").addEventListener("click", closeProductModal);
    var addBtn = document.getElementById("modalAddBtn");
    if(addBtn) addBtn.addEventListener("click", function(){ addToCart(p.id); closeProductModal(); openCart(); });
    hydratePhotos(document.getElementById("productModalCard"));
    hydrateIcons(document.getElementById("productModalCard"));

    document.getElementById("productModalWrap").classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeProductModal(){
    document.getElementById("productModalWrap").classList.remove("open");
    if(!document.getElementById("cartDrawer").classList.contains("open") && !document.getElementById("orderModalWrap").classList.contains("open")){
      document.body.style.overflow = "";
    }
  }

  /* =====================================================
     CART
     ===================================================== */
  function addToCart(id){
    state.cart[id] = (state.cart[id]||0) + 1;
    saveCart(); renderCart();
  }
  function changeQty(id, delta){
    if(!state.cart[id]) return;
    state.cart[id] += delta;
    if(state.cart[id] <= 0) delete state.cart[id];
    saveCart(); renderCart();
  }
  function removeFromCart(id){ delete state.cart[id]; saveCart(); renderCart(); }
  function clearCart(){ state.cart = {}; saveCart(); renderCart(); }
  function cartCount(){ var n=0; Object.keys(state.cart).forEach(function(id){ n+=state.cart[id]; }); return n; }

  function renderCart(){
    var ids = Object.keys(state.cart);
    var countEl = document.getElementById("cartCount");
    var n = cartCount();
    if(n>0){ countEl.hidden=false; countEl.textContent=n; } else { countEl.hidden=true; }

    var body = document.getElementById("cartBody");
    if(!ids.length){
      body.innerHTML = '<div class="empty-state"><svg><use href="#i-cart"/></svg><p>'+t("cartEmpty")+'</p></div>';
    } else {
      body.innerHTML = ids.map(function(id){
        var p = productById(id); if(!p) return "";
        var swatchInner = p.multi
          ? '<span style="width:14px;height:14px;border-radius:50%;background:'+SOAP_DOTS[0]+'"></span>'
          : '<svg><use href="#'+p.icon+'"/></svg>';
        return '<div class="cart-item">'+
          '<div class="cart-item-swatch" style="--accent:var(--accent-'+p.accent+');--accent-soft:var(--accent-'+p.accent+'-soft);">'+swatchInner+'</div>'+
          '<div class="cart-item-info">'+
            '<h5>'+tt(p.name)+'</h5>'+
            '<p>'+priceText(p)+'</p>'+
            '<div class="qty-row">'+
              '<button class="qty-btn" data-act="dec" data-id="'+id+'">−</button>'+
              '<span class="qty-val">'+state.cart[id]+'</span>'+
              '<button class="qty-btn" data-act="inc" data-id="'+id+'">+</button>'+
              '<button class="remove-link" data-act="rm" data-id="'+id+'">'+t("cartRemove")+'</button>'+
            '</div>'+
          '</div>'+
        '</div>';
      }).join("");
    }
    document.getElementById("cartCheckoutBtn").disabled = ids.length===0;

    body.querySelectorAll("[data-act]").forEach(function(btn){
      var id = btn.getAttribute("data-id");
      var act = btn.getAttribute("data-act");
      btn.addEventListener("click", function(){
        if(act==="inc") changeQty(id,1);
        else if(act==="dec") changeQty(id,-1);
        else if(act==="rm") removeFromCart(id);
      });
    });
    hydrateIcons(body);
  }

  function openCart(){
    document.getElementById("cartDrawer").classList.add("open");
    document.getElementById("cartOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeCart(){
    document.getElementById("cartDrawer").classList.remove("open");
    document.getElementById("cartOverlay").classList.remove("open");
    if(!document.getElementById("orderModalWrap").classList.contains("open")) document.body.style.overflow = "";
  }

  /* =====================================================
     ORDER MODAL
     ===================================================== */
  function openOrderModal(){
    var ids = Object.keys(state.cart);
    if(!ids.length) return;
    document.getElementById("orderFormStep").hidden = false;
    document.getElementById("orderSendStep").hidden = true;
    document.getElementById("orderErrorHint").hidden = true;
    var rows = ids.map(function(id){
      var p = productById(id);
      return '<div class="order-summary-row"><span>'+tt(p.name)+'</span><span>× '+state.cart[id]+'</span></div>';
    });
    rows.push('<div class="order-summary-row"><span>'+t("orderDelivery")+'</span><span>'+DELIVERY_FEE+' '+CURRENCY+'</span></div>');
    if(cartFullyPriced()){
      rows.push('<div class="order-summary-row order-summary-total"><span>'+t("orderTotal")+'</span><span>'+(cartSubtotal()+DELIVERY_FEE)+' '+CURRENCY+'</span></div>');
    } else {
      rows.push('<div class="order-summary-row order-summary-total"><span>'+t("orderTotal")+'</span><span>'+t("priceNote")+'</span></div>');
    }
    document.getElementById("orderSummaryList").innerHTML = rows.join("");
    closeCart();
    document.getElementById("orderModalWrap").classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeOrderModal(){
    document.getElementById("orderModalWrap").classList.remove("open");
    document.body.style.overflow = "";
  }

  function buildOrderMessage(name, phone, address, note){
    var lines = [];
    lines.push("Zohour Naturals — " + t("orderMsgNewOrder"));
    lines.push("");
    Object.keys(state.cart).forEach(function(id){
      var p = productById(id);
      lines.push("• " + tt(p.name) + "  × " + state.cart[id]);
    });
    lines.push("");
    lines.push(t("orderDelivery") + ": " + DELIVERY_FEE + " " + CURRENCY);
    if(cartFullyPriced()){
      lines.push(t("orderTotal") + ": " + (cartSubtotal() + DELIVERY_FEE) + " " + CURRENCY);
    }
    lines.push("");
    lines.push(t("orderMsgName") + ": " + name);
    lines.push(t("orderMsgPhone") + ": " + phone);
    if(address.city) lines.push(t("orderCity") + ": " + address.city);
    if(address.district) lines.push(t("orderDistrict") + ": " + address.district);
    var flat = [
      address.building ? (t("orderBuilding") + " " + address.building) : "",
      address.floor ? (t("orderFloor") + " " + address.floor) : "",
      address.apartment ? (t("orderApartment") + " " + address.apartment) : ""
    ].filter(function(x){ return x; }).join(", ");
    if(flat) lines.push(flat);
    if(note) lines.push(t("orderMsgNote") + ": " + note);
    return lines.join("\n");
  }

  function prepareOrder(){
    var name = document.getElementById("orderNameInput").value.trim();
    var phone = document.getElementById("orderPhoneInput").value.trim();
    var city = document.getElementById("orderCityInput").value.trim();
    var district = document.getElementById("orderDistrictInput").value.trim();
    var building = document.getElementById("orderBuildingInput").value.trim();
    var floor = document.getElementById("orderFloorInput").value.trim();
    var apartment = document.getElementById("orderApartmentInput").value.trim();
    var note = document.getElementById("orderNoteInput").value.trim();
    var errEl = document.getElementById("orderErrorHint");
    if(!name || !phone || !city || !district){
      errEl.textContent = t("orderErrorRequired");
      errEl.hidden = false;
      return;
    }
    errEl.hidden = true;
    var msg = buildOrderMessage(name, phone, { city:city, district:district, building:building, floor:floor, apartment:apartment }, note);
    document.getElementById("orderMessageText").value = msg;
    var waLink = "https://wa.me/" + SHOP_WHATSAPP + "?text=" + encodeURIComponent(msg);
    document.getElementById("orderWhatsappLink").href = waLink;

    var emailBtn = document.getElementById("orderEmailLink");
    if(SHOP_EMAIL){
      emailBtn.href = "mailto:" + SHOP_EMAIL + "?subject=" + encodeURIComponent("Zohour Naturals — new order") + "&body=" + encodeURIComponent(msg);
      emailBtn.hidden = false;
    } else {
      emailBtn.hidden = true;
    }

    document.getElementById("orderFormStep").hidden = true;
    document.getElementById("orderSendStep").hidden = false;
  }

  function copyOrderMessage(){
    var ta = document.getElementById("orderMessageText");
    var note = document.getElementById("orderCopyNote");
    var done = function(ok){ note.textContent = ok ? t("orderCopyNoteOk") : t("orderCopyNoteFail"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){ done(true); }, function(){
        ta.select(); try{ done(document.execCommand("copy")); }catch(e){ done(false); }
      });
    } else {
      ta.select();
      try{ done(document.execCommand("copy")); }catch(e){ done(false); }
    }
  }

  /* =====================================================
     THEME (light / dark) — a manual switch on top of the automatic
     prefers-color-scheme detection. Once the visitor clicks it, their
     choice is remembered (localStorage) and overrides the OS setting.
     ===================================================== */
  function currentEffectiveTheme(){
    var chosen = document.documentElement.getAttribute("data-theme");
    if(chosen === "light" || chosen === "dark") return chosen;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function applyTheme(theme){
    if(theme === "light" || theme === "dark"){
      document.documentElement.setAttribute("data-theme", theme);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    var effective = currentEffectiveTheme();
    // icon shows what clicking it will switch TO
    document.getElementById("themeIcon").innerHTML = '<use href="#' + (effective === "dark" ? "i-sun" : "i-moon") + '"/>';
    hydrateIcons(document.getElementById("themeToggle"));
  }
  function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem("zn_theme"); }catch(e){}
    applyTheme(saved === "light" || saved === "dark" ? saved : null);
  }

  /* =====================================================
     GLOBAL RENDER
     ===================================================== */
  function renderAll(){
    applyLanguage();
    renderHeroSwatches();
    renderCatNav();
    renderCatalog();
    renderDiscounts();
    renderGiftSet();
    renderTips();
    renderReviews();
    renderCart();
    document.getElementById("contactWhatsappLink").textContent = "+" + SHOP_WHATSAPP;
    document.getElementById("contactWhatsappLink").href = "https://wa.me/" + SHOP_WHATSAPP;
    document.getElementById("contactEmailCard").hidden = !SHOP_EMAIL;
    if(SHOP_EMAIL){
      document.getElementById("contactEmailLink").textContent = SHOP_EMAIL;
      document.getElementById("contactEmailLink").href = "mailto:" + SHOP_EMAIL;
    }
    document.querySelectorAll('[data-i18n="contactCityValue"]').forEach(function(el){ el.textContent = tt(SHOP_CITY); });
    document.querySelectorAll('[data-i18n="contactHoursValue"]').forEach(function(el){ el.textContent = tt(SHOP_HOURS); });
  }

  /* =====================================================
     EVENTS
     ===================================================== */
  document.querySelectorAll("#langSwitch button").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.lang = btn.getAttribute("data-lang");
      renderAll();
    });
  });
  document.getElementById("themeToggle").addEventListener("click", function(){
    var next = currentEffectiveTheme() === "dark" ? "light" : "dark";
    try{ localStorage.setItem("zn_theme", next); }catch(e){}
    applyTheme(next);
  });
  document.getElementById("cartBtn").addEventListener("click", openCart);
  document.getElementById("cartCloseBtn").addEventListener("click", closeCart);
  document.getElementById("cartOverlay").addEventListener("click", closeCart);
  document.getElementById("cartClearBtn").addEventListener("click", clearCart);
  document.getElementById("cartCheckoutBtn").addEventListener("click", openOrderModal);
  document.getElementById("giftsetAddBtn").addEventListener("click", addGiftSetToCart);
  document.getElementById("orderCloseBtn").addEventListener("click", closeOrderModal);
  document.getElementById("orderDoneBtn").addEventListener("click", closeOrderModal);
  document.getElementById("orderPrepareBtn").addEventListener("click", prepareOrder);
  document.getElementById("productModalWrap").addEventListener("click", function(e){ if(e.target===e.currentTarget) closeProductModal(); });
  document.getElementById("orderModalWrap").addEventListener("click", function(e){ if(e.target===e.currentTarget) closeOrderModal(); });
  document.getElementById("orderCopyBtn").addEventListener("click", copyOrderMessage);

  document.getElementById("hamburgerBtn").addEventListener("click", function(){
    document.getElementById("mobileNav").classList.toggle("open");
  });
  document.querySelectorAll("#mobileNav a").forEach(function(a){
    a.addEventListener("click", function(){ document.getElementById("mobileNav").classList.remove("open"); });
  });

  function checkHamburger(){
    document.getElementById("hamburgerBtn").style.display = window.innerWidth <= 900 ? "inline-flex" : "none";
  }
  window.addEventListener("resize", checkHamburger);
  checkHamburger();

  document.getElementById("year").textContent = new Date().getFullYear();

  hydrateIcons(document);
  initOpenGroups();
  initTheme();
  renderAll();
})();
</script>
